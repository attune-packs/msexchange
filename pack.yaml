ref: msexchange
label: "Microsoft Exchange"
description: "Actions and polling events for Microsoft Exchange Server and Exchange Online through EWS"
version: "0.1.1"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema:
  default_credential_key:
    type: string
    description: "Pack-owned Key containing Exchange credentials"
    default: "msexchange.credentials"

config:
  default_credential_key: "msexchange.credentials"

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/msexchange"
  repository_url: "https://github.com/attune-packs/msexchange"
  source_version: "1.1.3"
  license: "Apache-2.0"
  python_dependencies:
    - "attune-sdk[sensor]>=0.1.0"
    - "exchangelib>=5.4,<6"
    - "python-dateutil>=2.8"
    - "PyYAML>=6.0,<7"

tags: [exchange, ews, email, calendar, office365]
runtime_deps: [python]
dependencies: [core]

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block

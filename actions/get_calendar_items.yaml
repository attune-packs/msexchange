ref: msexchange.get_calendar_items
label: "Get Exchange Calendar Items"
description: "Get calendar items overlapping a date range"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: exchange_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  operation: {type: string, const: get_calendar_items, default: get_calendar_items}
  credential_key: {type: string, default: "pack.msexchange.credentials"}
  start_year: {type: integer, required: true}
  start_month: {type: integer, required: true, minimum: 1, maximum: 12}
  start_day: {type: integer, required: true, minimum: 1, maximum: 31}
  end_year: {type: integer, required: true}
  end_month: {type: integer, required: true, minimum: 1, maximum: 12}
  end_day: {type: integer, required: true, minimum: 1, maximum: 31}
output:
  operation: {type: string, required: true}
  result: {type: array, required: true, items: {type: object}}
tags: [exchange, calendar]

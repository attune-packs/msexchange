ref: msexchange.send_email
label: "Send Exchange Email"
description: "Send an email and optionally store it in Sent Items"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: exchange_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  operation: {type: string, const: send_email, default: send_email}
  credential_key: {type: string, default: "msexchange.credentials"}
  subject: {type: string, required: true}
  body: {type: string, required: true}
  to_recipients: {type: array, required: true, min_items: 1, items: {type: string}}
  store: {type: boolean, default: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [exchange, email, send]
